name: FR gate

# Per-repo caller. Blocks merges to main unless every contained kanban item is in
# "Ready for prod". All logic lives in tracebloc/.github/.github/workflows/fr-gate.yml.
#
# docs is fr-gate EXEMPT by policy (backend#1276): content PRs may target `main`
# directly without the develop -> staging -> main gate, and docs stays OFF the
# release train (decided, backend#1420). This caller only makes the `gate / gate`
# CHECK EXIST; it is deliberately NOT a required check. The real content gates on
# docs are code-quality (gitleaks + house-rules), not this one.
#
# `branches:` is `[main]` only — docs has no `staging` (off-train) and never had a
# `master` (listing a branch that does not exist is how dead filters accumulate,
# backend#1428).

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]

jobs:
  gate:
    uses: tracebloc/.github/.github/workflows/fr-gate.yml@main
    secrets: inherit
