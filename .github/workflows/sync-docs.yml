name: Sync docs from upstream

# Triggers:
#   - repository_dispatch: fired by source repos when a watched file changes (push-driven)
#   - workflow_dispatch:   manual run from the Actions tab (optional source_id input)
#   - schedule:            daily safety-net in case a dispatch is missed
on:
  repository_dispatch:
    types: [upstream-changed]
  workflow_dispatch:
    inputs:
      source_id:
        description: "Specific source id from sync-sources.yml (leave empty for all)"
        required: false
        type: string
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write
  pull-requests: write
  # claude-code-action v1.0.x mints its GitHub App token via OIDC even when
  # anthropic_api_key is supplied — without this the run dies with "Unable to
  # get ACTIONS_ID_TOKEN_REQUEST_URL" (found 2026-08-05, the third distinct
  # layer of rot from 84 days of nobody listening; backend#1494).
  id-token: write

concurrency:
  group: sync-docs
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      # Pinned by version AND digest. The version was already pinned; the digest
      # is what makes the pin meaningful, since a release asset can be replaced
      # in place. To bump, change both together, taking the SHA-256 from the
      # upstream `checksums-bsd` release asset:
      #   https://github.com/mikefarah/yq/releases/download/v<version>/checksums-bsd
      # (Use `checksums-bsd`, not `checksums` — the latter packs 31 different
      # hash algorithms into unlabelled columns, so reading SHA-256 out of it
      # means counting columns against `checksums_hashes_order`.)
      YQ_VERSION: "4.44.3"
      YQ_SHA256: "a2c097180dd884a8d50c956ee16a9cec070f30a7947cf4ebf87d5f36213e9ed7"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve PR base and accumulate onto existing sync branch
        id: setup
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          base=$(gh repo view --json defaultBranchRef -q .defaultBranchRef.name)
          echo "base=$base" >> "$GITHUB_OUTPUT"
          # Snapshot the mapping from the base branch BEFORE possibly switching
          # to the sync branch, so we never use a stale config from a pending
          # PR (e.g. if a new source was added on main after the PR opened).
          cp .github/sync-sources.yml /tmp/sync-sources.yml
          if git ls-remote --exit-code --heads origin docs/sync-upstream >/dev/null 2>&1; then
            echo "Existing docs/sync-upstream branch found — checking it out so this run accumulates onto pending changes."
            git fetch origin docs/sync-upstream:docs/sync-upstream
            git checkout docs/sync-upstream
          else
            echo "No existing sync branch — starting from $base."
          fi

      - name: Install yq (version + digest pinned)
        # Was `sudo wget -qO /usr/local/bin/yq <url>` — it wrote whatever came
        # back straight to a directory on PATH, then marked it executable, with
        # nothing verifying the bytes. This job runs with `contents: write` and
        # holds ANTHROPIC_API_KEY and SOURCE_REPOS_TOKEN, so anything that
        # executed here could read both. Download to a temp file, verify against
        # the pinned digest, and only install once it matches.
        run: |
          set -euo pipefail
          # Assert the digest is a full SHA-256 before trusting it. `sha256sum -c`
          # reports a malformed line as "no properly formatted checksum lines
          # found", and whether that is a non-zero exit depends on the coreutils
          # build (GNU exits 1; the macOS sha256sum exits 0). An empty or
          # truncated env var must be a hard failure here, not a verification
          # that quietly checks nothing and lets the install proceed.
          if [[ ! "${YQ_SHA256}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::YQ_SHA256 is not a 64-character hex SHA-256 digest."
            exit 1
          fi
          URL="https://github.com/mikefarah/yq/releases/download/v${YQ_VERSION}/yq_linux_amd64"
          # -f so an HTTP error page is a failure rather than a file on disk.
          curl -fsSL --retry 3 --retry-delay 2 -o "$RUNNER_TEMP/yq" "$URL"
          # A mismatch exits non-zero here, and `set -e` fails the step before
          # the binary reaches /usr/local/bin.
          echo "${YQ_SHA256}  $RUNNER_TEMP/yq" | sha256sum -c -
          sudo install -m 0755 "$RUNNER_TEMP/yq" /usr/local/bin/yq
          yq --version

      - name: Resolve target sources
        id: filter
        env:
          DISPATCH_ID: ${{ github.event.client_payload.source_id }}
          INPUT_ID: ${{ inputs.source_id }}
        run: |
          target="${DISPATCH_ID:-${INPUT_ID:-}}"
          if [ -n "$target" ]; then
            echo "Filtering for source: $target"
            # Pass `target` to yq via env + strenv() so the value never gets
            # interpolated into the yq expression as a string literal.
            # Untrusted client_payload / workflow_dispatch input can't break
            # out of the query or inject yq syntax.
            TARGET="$target" yq -o=json \
              '.sources[] | select(.id == strenv(TARGET))' \
              /tmp/sync-sources.yml | jq -s . > /tmp/sources.json
          else
            echo "Processing all sources"
            yq -o=json '.sources' /tmp/sync-sources.yml > /tmp/sources.json
          fi
          count=$(jq length /tmp/sources.json)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Found $count source(s) to process"
          if [ "$count" = "0" ]; then
            echo "Nothing to do."
          fi

      - name: Fetch upstream files
        if: steps.filter.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.SOURCE_REPOS_TOKEN || secrets.GITHUB_TOKEN }}
          # true only when the PAT actually exists — used to give an actionable
          # error, without ever exposing the secret value.
          HAS_SOURCE_TOKEN: ${{ secrets.SOURCE_REPOS_TOKEN != '' && 'yes' || 'no' }}
        run: |
          mkdir -p /tmp/sync-cache
          failed=""
          # Fetch every source, then report — don't die on the first one. The
          # default GITHUB_TOKEN is scoped to THIS repo, so a private source
          # (e.g. tracebloc-py-package) 404s unless SOURCE_REPOS_TOKEN is set;
          # dying on the first source hid the other four and produced only a
          # cryptic `gh: Not Found`. Process substitution (not `jq | while`) so
          # the loop runs in this shell and `failed` survives.
          while read -r s; do
            id=$(jq -r .id <<<"$s")
            repo=$(jq -r .repo <<<"$s")
            ref=$(jq -r .ref <<<"$s")
            src=$(jq -r .src <<<"$s")
            echo "Fetching $repo@$ref:$src -> /tmp/sync-cache/$id"
            if gh api "repos/$repo/contents/$src?ref=$ref" \
                 -H "Accept: application/vnd.github.raw" \
                 > "/tmp/sync-cache/$id" 2>/tmp/gh-err; then
              continue
            fi
            rm -f "/tmp/sync-cache/$id"   # don't sync a truncated/empty file
            echo "::error::Could not fetch ${repo}@${ref}:${src} — $(tr -d '\n' < /tmp/gh-err)"
            failed="$failed ${id}(${repo})"
          done < <(jq -c '.[]' /tmp/sources.json)

          ls -la /tmp/sync-cache || true

          if [ -n "$failed" ]; then
            echo "::error::Upstream fetch failed for:$failed"
            if [ "$HAS_SOURCE_TOKEN" = "no" ]; then
              echo "::error::SOURCE_REPOS_TOKEN is not set. Private sources are then read with the docs-scoped GITHUB_TOKEN, which 404s cross-repo. Create a fine-grained PAT with Contents:read on the private source repo(s) — currently tracebloc/tracebloc-py-package — and add it as the SOURCE_REPOS_TOKEN Actions secret on this repo (or the org)."
            fi
            exit 1
          fi

      - name: Run Claude to update docs
        if: steps.filter.outputs.count != '0'
        uses: anthropics/claude-code-action@86180fa9e4d311eed10c9cc49854c53dab5d517a # v1.0.184
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            You are syncing this Mintlify docs site with upstream README changes.

            The mapping is at `/tmp/sync-sources.yml` (snapshotted from the
            base branch at the start of this run, so it is always current).
            The list of sources to process this run is at `/tmp/sources.json`.
            For each source, the latest upstream file content is at
            `/tmp/sync-cache/<id>`.

            For every entry in `/tmp/sources.json`:
              1. Read `/tmp/sync-cache/<id>` (upstream) and the docs page at `dest`.
              2. Apply the entry's `instruction` to update the docs page in place.
              3. Preserve YAML frontmatter, page-specific framing, links to other
                 Mintlify pages, and any callouts/components already on the page.
              4. Follow `AGENTS.md` style: active voice, second person, sentence
                 case headings, **bold** for UI elements, `code` for paths and
                 commands.
              5. If the upstream content does not meaningfully change anything in
                 the docs page, skip that source — do not edit the file.

            Do not edit any files outside the `dest` paths listed in the
            sources. Do not touch `/tmp/sync-cache/`, `/tmp/sources.json`,
            or `/tmp/sync-sources.yml`.

      - name: Open or update PR
        if: steps.filter.outputs.count != '0'
        # v8, and BOTH halves of that are load-bearing.
        #
        # Compatibility: checkout v6+ writes its credentials under $RUNNER_TEMP,
        # and create-pull-request before v7.0.9 then sends a duplicate
        # `Authorization` header and fails this step outright
        # (peter-evans/create-pull-request#4228, fixed by #4230). Bumping checkout
        # to v7.0.1 in this commit while leaving v6.1.0 here would have stopped
        # the docs sync opening or updating PRs at all — silently, since a sync
        # that never runs files no complaint (Bugbot).
        #
        # Runtime: v7.0.11 fixes the clash but is still `using: node20`, so it
        # would have failed THIS commit's whole purpose. v8.0.0 is the first
        # `node24` release. Its only breaking change is requiring Actions Runner
        # v2.327.1+ on SELF-HOSTED runners; every job in this repo is
        # GitHub-hosted, so it does not apply here.
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          base: ${{ steps.setup.outputs.base }}
          branch: docs/sync-upstream
          delete-branch: true
          add-paths: "**/*.mdx"
          commit-message: "docs: sync upstream sources"
          title: "docs: sync upstream sources"
          body: |
            Automated sync from upstream repos via Claude.

            **Triggered by:** `${{ github.event_name }}`
            **Source filter:** `${{ github.event.client_payload.source_id || inputs.source_id || 'all' }}`

            Review carefully — Claude rewrites prose to fit docs style, but
            verify accuracy against the upstream README before merging.
          labels: |
            docs-sync
            automated
